<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor Mart - Bulk Image Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 { color: #4a148c; text-align: center; margin-top: 5px; font-size: 20px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        .upload-area {
            border: 2px dashed #7b1fa2;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            background: #fdf7ff;
            cursor: pointer;
        }
        input[type="file"] { display: none; }
        .btn-select {
            background: #7b1fa2;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            margin-top: 8px;
        }
        .status {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            color: #4a148c;
            display: none;
        }
        .item-row {
            display: flex;
            align-items: center;
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
            margin-top: 10px;
            gap: 10px;
        }
        .item-thumb {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
        }
        .item-link {
            width: 95%;
            font-size: 11px;
            padding: 4px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        .btn-copy-one {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-copy-all {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Manor Mart Bulk Uploader</h2>
    <div class="subtitle">Ek sath 15-20 photos select karein aur direct link paayein.</div>

    <label class="upload-area" for="fileInput">
        <div style="font-size: 30px;">📸</div>
        <span style="font-size: 14px; color: #555;">Gallery se ek sath sabhi photos chunein</span><br>
        <span class="btn-select">Select Multiple Photos</span>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="startBulkUpload()">
    </label>

    <div id="status" class="status"></div>

    <button id="btnCopyAll" class="btn-copy-all" onclick="copyAllLinks()">📋 Copy All 15+ Links Together</button>

    <div id="linksList"></div>
</div>

<script>
    const IMGBB_KEY = "8f3b6c2ecdc3a0beaa127b4bcba4b54e"; 
    let allLinksArray = [];

    async function startBulkUpload() {
        const input = document.getElementById('fileInput');
        const files = input.files;
        if (!files.length) return;

        const status = document.getElementById('status');
        const list = document.getElementById('linksList');
        const copyAllBtn = document.getElementById('btnCopyAll');

        list.innerHTML = "";
        allLinksArray = [];
        status.style.display = "block";
        copyAllBtn.style.display = "none";

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.innerText = `Uploading (${i + 1}/${files.length}): ${file.name}...`;

            try {
                const formData = new FormData();
                formData.append("image", file);

                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (data.success && data.data.url) {
                    const directUrl = data.data.display_url || data.data.url;
                    allLinksArray.push(directUrl);

                    const row = document.createElement('div');
                    row.className = "item-row";
                    row.innerHTML = `
                        <img src="${directUrl}" class="item-thumb">
                        <div class="item-info">
                            <div class="item-name">${file.name}</div>
                            <input type="text" value="${directUrl}" class="item-link" id="link_${i}" readonly>
                        </div>
                        <button class="btn-copy-one" onclick="copySingle('link_${i}')">Copy</button>
                    `;
                    list.appendChild(row);
                }
            } catch (err) {
                console.error(err);
            }
        }

        status.innerText = `✅ Upload Complete! Kul ${allLinksArray.length} photos ready hain.`;
        if (allLinksArray.length > 0) {
            copyAllBtn.style.display = "block";
        }
    }

    function copySingle(elementId) {
        const input = document.getElementById(elementId);
        input.select();
        document.execCommand('copy');
        alert("Copied: " + input.value);
    }

    function copyAllLinks() {
        if (!allLinksArray.length) return;
        const text = allLinksArray.join("\n");
        navigator.clipboard.writeText(text).then(() => {
            alert("Saare " + allLinksArray.length + " links copy ho gaye!");
        });
    }
</script>

</body>
</html>
