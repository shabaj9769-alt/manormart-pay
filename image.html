<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor Mart - Quick Image Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .box {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #4a148c; margin-top: 0; font-size: 20px; }
        p { color: #555; font-size: 13px; }
        .file-input {
            margin: 20px 0;
            padding: 10px;
            border: 2px dashed #6a1b9a;
            border-radius: 8px;
            width: 90%;
            background: #faf5fc;
        }
        .btn-copy {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            text-align: left;
            word-break: break-all;
        }
        .preview {
            max-width: 100%;
            height: 140px;
            object-fit: contain;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚡ Manor Mart Image Linker</h2>
        <p>Canva photo select karein, direct <b>.jpg/.png</b> link turant mil jayega.</p>
        
        <input type="file" id="imageInput" class="file-input" accept="image/*" onchange="uploadImage()">
        
        <div id="loader" style="display:none; color:#6a1b9a; font-weight:bold; margin: 15px 0;">Uploading... Kirpya rukhein...</div>
        
        <img id="previewImg" class="preview">

        <div id="resultBox" class="result-box">
            <span style="font-size:12px; color:#2e7d32; font-weight:bold;">Direct Link:</span>
            <input type="text" id="linkText" style="width:100%; margin-top:4px; padding:6px; font-size:12px;" readonly>
            <button class="btn-copy" onclick="copyLink()">📋 Copy Direct URL</button>
        </div>
    </div>

    <script>
        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            if (!file) return;

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('previewImg').style.display = 'none';

            const formData = new FormData();
            formData.append('image', file);

            try {
                // Freeimage API jo direct link deta hai
                const res = await fetch('https://freeimage.host/api/1/upload?key=6d207e02198a847aa98d0a2a901485a5', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                document.getElementById('loader').style.display = 'none';

                if (data && data.image && data.image.url) {
                    const directUrl = data.image.url;
                    document.getElementById('linkText').value = directUrl;
                    document.getElementById('previewImg').src = directUrl;
                    document.getElementById('previewImg').style.display = 'block';
                    document.getElementById('resultBox').style.display = 'block';
                } else {
                    alert('Upload fail ho gaya. Kripya dobara try karein.');
                }
            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                alert('Internet issue ya error: ' + err.message);
            }
        }

        function copyLink() {
            const copyText = document.getElementById('linkText');
            copyText.select();
            document.execCommand('copy');
            alert('Direct Image URL clipboard mein copy ho gaya!');
        }
    </script>
</body>
</html>
