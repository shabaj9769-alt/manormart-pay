<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor Mart Bulk Uploader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #4a148c; text-align: center; margin-top: 5px; font-size: 20px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        .upload-area {
            border: 2px dashed #7b1fa2;
            padding: 22px;
            border-radius: 10px;
            text-align: center;
            background: #fdf7ff;
            cursor: pointer;
            display: block;
        }
        input[type="file"] { display: none; }
        .btn-select {
            background: #7b1fa2;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
        .status {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            color: #4a148c;
            display: none;
            font-size: 14px;
        }
        .item-row {
            display: flex;
            align-items: center;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
            margin-top: 10px;
            gap: 10px;
        }
        .item-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #333;
        }
        .item-link {
            width: 95%;
            font-size: 11px;
            padding: 5px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        .btn-copy-one {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-copy-all {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Manor Mart Bulk Uploader</h2>
    <div class="subtitle">Ek sath 15-20 photos select karein aur direct link paayein.</div>

    <label class="upload-area" for="fileInput">
        <div style="font-size: 32px;">📸</div>
        <span style="font-size: 14px; color: #555;">Gallery se sabhi photos ek sath chunein</span><br>
        <span class="btn-select">Select Multiple Photos</span>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="startBulkUpload()">
    </label>

    <div id="status" class="status"></div>

    <button id="btnCopyAll" class="btn-copy-all" onclick="copyAllLinks()">📋 Copy All Links Together</button>

    <div id="linksList"></div>
</div>

<script>
    let allLinksArray = [];

    async function startBulkUpload() {
        const input = document.getElementById('fileInput');
        const files = input.files;
        if (!files || !files.length) return;

        const status = document.getElementById('status');
        const list = document.getElementById('linksList');
        const copyAllBtn = document.getElementById('btnCopyAll');

        list.innerHTML = "";
        allLinksArray = [];
        status.style.display = "block";
        copyAllBtn.style.display = "none";

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.innerText = `Uploading (${i + 1}/${files.length}): ${file.name}...`;

            try {
                const formData = new FormData();
                formData.append('reqtype', 'fileupload');
                formData.append('fileToUpload', file);

                // Direct Catbox upload endpoint (No API Key Required)
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://catbox.moe/user/api.php'), {
                    method: 'POST',
                    body: formData
                });

                const directUrl = (await res.text()).trim();

                if (directUrl.startsWith('http')) {
                    allLinksArray.push(directUrl);

                    const row = document.createElement('div');
                    row.className = "item-row";
                    row.innerHTML = `
                        <img src="${directUrl}" class="item-thumb">
                        <div class="item-info">
                            <div class="item-name">${file.name}</div>
                            <input type="text" value="${directUrl}" class="item-link" id="link_${i}" readonly>
                        </div>
                        <button class="btn-copy-one" onclick="copySingle('link_${i}')">Copy</button>
                    `;
                    list.appendChild(row);
                } else {
                    console.error("Upload error: ", directUrl);
                    alert(`Error in ${file.name}: ` + directUrl);
                }
            } catch (err) {
                console.error("Fetch error: ", err);
                alert(`Upload failed for ${file.name}: ` + err.message);
            }
        }

        status.innerText = `✅ Done! Kul ${allLinksArray.length} photos ke direct links ready hain!`;
        if (allLinksArray.length > 0) {
            copyAllBtn.style.display = "block";
        }
    }

    function copySingle(elementId) {
        const input = document.getElementById(elementId);
        input.select();
        document.execCommand('copy');
        alert("Copied!");
    }

    function copyAllLinks() {
        if (!allLinksArray.length) return;
        const text = allLinksArray.join("\n");
        navigator.clipboard.writeText(text).then(() => {
            alert("Saare " + allLinksArray.length + " links copy ho gaye!");
        });
    }
</script>

</body>
</html>
