<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manor Mart - Secure Checkout</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3e5f5;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-sizing: border-box;
        }
        .badge {
            display: inline-block;
            background: #e1bee7;
            color: #4a148c;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        h2 { color: #4a148c; margin: 6px 0; font-size: 20px; }
        .amount { font-size: 30px; font-weight: bold; color: #2e7d32; margin: 12px 0; }
        .btn-pay {
            background-color: #6a1b9a;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(106, 27, 154, 0.3);
        }
        .status-box {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-top: 14px;
            font-size: 13px;
            font-weight: bold;
        }
        .success-box {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .fail-box {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .action-btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 12px;
            width: 90%;
            cursor: pointer;
            border: none;
        }
        .btn-success { background-color: #2e7d32; color: white; }
        .btn-retry { background-color: #e65100; color: white; }
        .cancel-link {
            display: inline-block;
            margin-top: 15px;
            color: #777;
            font-size: 12px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">🔒 256-BIT SECURE CHECKOUT</div>
        <h2>🛒 Manor Mart Payment</h2>
        <p style="color: #666; font-size: 12px; margin: 4px 0;">Order Ref: <strong id="display-order-id">Loading...</strong></p>
        <div class="amount">₹<span id="display-amount">0.00</span></div>
        
        <button id="pay-btn" class="btn-pay" onclick="startPayment()">⚡ Pay via UPI / Cards / NetBanking</button>

        <div id="status-container" class="status-box"></div>
        
        <a href="manormart://" class="cancel-link">Cancel & Return to App</a>
    </div>

    <script>
        const dbUrl = "https://manorbiryani-default-rtdb.firebaseio.com/orders";
        const urlParams = new URLSearchParams(window.location.search);
        
        const amountRupees = urlParams.get('amount') || '0';
        let orderId = urlParams.get('order_id') || urlParams.get('orderId') || '';

        document.getElementById('display-amount').innerText = amountRupees;
        document.getElementById('display-order-id').innerText = orderId ? '#' + orderId.slice(-6) : 'Online Order';

        let paymentProcessed = false;

        async function markOrderSuccessfulInFirebase(paymentId) {
            if (!orderId) return false;
            const endpoint = dbUrl + "/" + orderId + ".json";
            try {
                const res = await fetch(endpoint, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        deliveryStatus: 'Order Successful',
                        razorpayPaymentId: paymentId
                    })
                });
                return res.ok;
            } catch (err) {
                return false;
            }
        }

        function showSuccessUI(paymentId) {
            document.getElementById('pay-btn').style.display = 'none';
            const statusDiv = document.getElementById('status-container');
            statusDiv.className = 'status-box success-box';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `
                <div style="font-size: 16px; margin-bottom: 4px;">🎉 Payment Successful!</div>
                <div style="font-size: 10.5px; color: #555;">Payment ID: ${paymentId}</div>
                <div style="font-size: 12px; margin-top: 6px; color: #1b5e20;">Order Placed Successfully!</div>
                <a href="manormart://" class="action-btn btn-success">🔙 Return to Manor Mart App</a>
            `;
            setTimeout(() => {
                window.location.href = "manormart://";
            }, 2500);
        }

        function showFailureUI() {
            document.getElementById('pay-btn').style.display = 'none';
            const statusDiv = document.getElementById('status-container');
            statusDiv.className = 'status-box fail-box';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `
                <div>❌ Payment Cancelled / Incomplete</div>
                <div style="font-size: 11px; margin-top: 4px; color: #666;">Payment complete nahi hua tha.</div>
                <button onclick="startPayment()" class="action-btn btn-retry">🔄 Retry Payment</button>
            `;
        }

        function startPayment() {
            const parsedAmount = Math.round(Number(amountRupees) * 100);
            if (!parsedAmount || parsedAmount <= 0) {
                alert("Invalid payable amount!");
                return;
            }

            const statusDiv = document.getElementById('status-container');
            statusDiv.style.display = 'none';
            document.getElementById('pay-btn').style.display = 'block';

            var options = {
                "key": "rzp_live_TbUQsW8HqKfMkm",
                "amount": parsedAmount,
                "currency": "INR",
                "name": "Manor Mart",
                "description": "Order " + (orderId ? '#' + orderId.slice(-6) : 'Online'),
                "image": "https://shabaj9769-alt.github.io/manormart-pay/assets/icon.png",
                "handler": async function (response) {
                    paymentProcessed = true;
                    await markOrderSuccessfulInFirebase(response.razorpay_payment_id);
                    showSuccessUI(response.razorpay_payment_id);
                },
                "modal": {
                    "ondismiss": function() {
                        if (!paymentProcessed) {
                            showFailureUI();
                        }
                    }
                },
                "prefill": {
                    "contact": "",
                    "email": "shabaj9769@gmail.com"
                },
                "theme": {
                    "color": "#4a148c"
                }
            };

            var rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response){
                showFailureUI();
            });
            rzp1.open();
        }

        window.addEventListener('load', () => {
            setTimeout(startPayment, 500);
        });
    </script>
</body>
</html>
