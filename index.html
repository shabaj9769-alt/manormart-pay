    <script>
        const dbUrl = "https://manorbiryani-default-rtdb.firebaseio.com/orders";
        const urlParams = new URLSearchParams(window.location.search);
        
        const amountRupees = urlParams.get('amount') || '10';
        let orderId = urlParams.get('order_id') || urlParams.get('orderId') || '';

        document.getElementById('display-amount').innerText = amountRupees;

        async function detectOrderId() {
            if (orderId) {
                document.getElementById('display-order-id').innerText = '#' + orderId.slice(-6);
                return orderId;
            }
            try {
                const res = await fetch(dbUrl + ".json");
                const data = await res.json();
                if (data) {
                    const keys = Object.keys(data);
                    for (let i = keys.length - 1; i >= 0; i--) {
                        let k = keys[i];
                        if (data[k] && data[k].deliveryStatus && data[k].deliveryStatus.includes('Payment Pending')) {
                            orderId = k;
                            document.getElementById('display-order-id').innerText = '#' + orderId.slice(-6);
                            return orderId;
                        }
                    }
                }
            } catch (e) {
                console.error("Auto detect failed", e);
            }
            return orderId;
        }

        let paymentProcessed = false;

        // Guaranteed background update function
        async function markOrderSuccessfulInFirebase(paymentId) {
            if (!orderId) {
                await detectOrderId();
            }
            if (!orderId) return false;

            const endpoint = dbUrl + "/" + orderId + "/deliveryStatus.json";
            
            try {
                // keepalive: true ensures request completes even if user closes tab
                const res = await fetch(endpoint, {
                    method: 'PUT',
                    keepalive: true,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify('Order Successful')
                });
                return res.ok;
            } catch (err) {
                console.error("Firebase update failed", err);
                return false;
            }
        }

        function showSuccessUI(paymentId) {
            document.getElementById('pay-btn').style.display = 'none';
            const statusDiv = document.getElementById('status-container');
            statusDiv.className = 'status-box success-box';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `
                <div>✅ Payment Successful!</div>
                <div style="font-size: 11px; margin-top: 4px; color: #555;">Payment ID: ${paymentId}</div>
                <div style="font-size: 12px; margin-top: 8px; color: #333;">Order Placed Successfully in Store!</div>
                <a href="manormart://orders" class="action-btn btn-success">🔙 Open Manor Mart App</a>
            `;
        }

        function showFailureUI() {
            document.getElementById('pay-btn').style.display = 'none';
            const statusDiv = document.getElementById('status-container');
            statusDiv.className = 'status-box fail-box';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `
                <div>❌ Payment Incomplete / Cancelled</div>
                <div style="font-size: 11px; margin-top: 4px; color: #666;">Aapka payment poora nahi hua tha.</div>
                <button onclick="startPayment()" class="action-btn btn-retry">🔄 Retry Payment</button>
            `;
        }

        async function startPayment() {
            if (!orderId) {
                await detectOrderId();
            }

            const statusDiv = document.getElementById('status-container');
            statusDiv.style.display = 'none';
            document.getElementById('pay-btn').style.display = 'block';

            var options = {
                "key": "rzp_live_TbUQsW8HqKfMkm",
                "amount": Math.round(Number(amountRupees) * 100),
                "currency": "INR",
                "name": "Manor Mart",
                "description": "Order " + (orderId ? '#' + orderId.slice(-6) : 'Online'),
                "handler": async function (response) {
                    paymentProcessed = true;
                    
                    // 1. Instantly update Firebase database before touching any redirect
                    await markOrderSuccessfulInFirebase(response.razorpay_payment_id);
                    
                    // 2. Render confirmation screen
                    showSuccessUI(response.razorpay_payment_id);

                    // 3. User app par wapas aaye ya tab close kar de, Firebase update pehle hi execute ho chuka hai
                },
                "modal": {
                    "ondismiss": function() {
                        if (!paymentProcessed) {
                            showFailureUI();
                        }
                    }
                },
                "prefill": {
                    "name": urlParams.get('name') || "Customer",
                    "email": urlParams.get('email') || "customer@manormart.in",
                    "contact": urlParams.get('phone') || ""
                },
                "theme": {
                    "color": "#4a148c"
                }
            };

            var rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response){
                showFailureUI();
            });
            rzp1.open();
        }

        window.addEventListener('load', async () => {
            await detectOrderId();
            setTimeout(startPayment, 300);
        });
    </script>
