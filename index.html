<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manormart Secure Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
            margin-bottom: 15px;
        }
        .store-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
        }
        h2 { color: #4a148c; margin-top: 0; font-size: 20px; }
        .amount { font-size: 26px; font-weight: bold; color: #2e7d32; margin: 10px 0; }
        .btn-pay {
            background-color: #6a1b9a;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-pay:hover { background-color: #4a148c; }
        .status-box {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }
        .success-box {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .fail-box {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .action-btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
            width: 90%;
            cursor: pointer;
            border: none;
        }
        .btn-success { background-color: #2e7d32; color: white; }
        .btn-retry { background-color: #e65100; color: white; }
        .btn-cancel { background-color: #757575; color: white; margin-top: 8px; font-size: 13px; }
        .category { font-weight: bold; color: #1b5e20; margin-top: 12px; border-bottom: 2px solid #c8e6c9; padding-bottom: 4px; font-size: 13px; }
        .product-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px solid #eee; color: #444; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛒 Manor Mart Payment</h2>
        <p style="color: #666; font-size: 13px; margin: 4px 0;">Order: <b id="display-order-id">Loading...</b></p>
        <div class="amount">₹<span id="display-amount">0.00</span></div>
        
        <button id="pay-btn" class="btn-pay" onclick="startPayment()">Proceed to Pay</button>

        <div id="status-container" class="status-box"></div>
    </div>

    <!-- Store Catalog -->
    <div class="store-section">
        <h3 style="color: #1b5e20; font-size: 15px; margin-top: 0; text-align: center;">🛒 Manor Mart Live Catalog</h3>
        <div class="category">🥕 Fresh Vegetables & Bhaji</div>
        <div class="product-row"><span>Fresh Tamatar (Tomato - 1 kg)</span> <span>₹40</span></div>
        <div class="product-row"><span>Pyaz (Onion - 1 kg)</span> <span>₹35</span></div>
        <div class="product-row"><span>Aloo (Potato - 1 kg)</span> <span>₹30</span></div>
        <div class="category">🥛 Milk & Dairy Products</div>
        <div class="product-row"><span>Fresh Cow Milk (1 Liter)</span> <span>₹32</span></div>
        <div class="product-row"><span>Amul Butter / Curd (500g)</span> <span>₹70</span></div>
        <div class="product-row"><span>Paneer (200g)</span> <span>₹90</span></div>
    </div>

    <script>
        const dbUrl = "https://manorbiryani-default-rtdb.firebaseio.com/orders";
        const urlParams = new URLSearchParams(window.location.search);
        
        const amountRupees = urlParams.get('amount') || '10';
        let orderId = urlParams.get('order_id') || urlParams.get('orderId') || '';

        document.getElementById('display-amount').innerText = amountRupees;

        // Auto find latest pending order if orderId is missing from URL
        async function detectOrderId() {
            if (orderId) {
                document.getElementById('display-order-id').innerText = '#' + orderId.slice(-6);
                return;
            }
            try {
                const res = await fetch(dbUrl + ".json");
                const data = await res.json();
                if (data) {
                    const keys = Object.keys(data);
                    // Dhoondo sabse aakhri pending order
                    for (let i = keys.length - 1; i >= 0; i--) {
                        let k = keys[i];
                        if (data[k] && data[k].deliveryStatus && data[k].deliveryStatus.includes('Payment Pending')) {
                            orderId = k;
                            document.getElementById('display-order-id').innerText = '#' + orderId.slice(-6);
                            break;
                        }
                    }
                }
            } catch (e) {
                console.error("Auto detect failed", e);
            }
            if (!orderId) {
                document.getElementById('display-order-id').innerText = 'Online Order';
            }
        }
        detectOrderId();

        let paymentProcessed = false;

        async function syncFirebaseStatus(statusText) {
            // Agar orderId abhi bhi nahi hai, dobara latest pending dhoondein
            if (!orderId) {
                await detectOrderId();
            }
            if (!orderId) return;

            try {
                await fetch(dbUrl + "/" + orderId + "/deliveryStatus.json", {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(statusText)
                });
            } catch (err) {
                console.error("Firebase sync error:", err);
            }
        }

        function showSuccessUI(paymentId) {
            document.getElementById('pay-btn').style.display = 'none';
            const statusDiv = document.getElementById('status-container');
            statusDiv.className = 'status-box success-box';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `
                <div>✅ Payment Successful!</div>
                <div style="font-size: 11px; margin-top: 4px; color: #555;">Payment ID: ${paymentId}</div>
                <div style="font-size: 12px; margin-top: 8px; color: #333;">Order Placed Successfully!</div>
                <a href="manormart://orders" class="action-btn btn-success">🔙 Open Manor Mart App</a>
            `;
            setTimeout(() => { window.location.href = "manormart://orders"; }, 1200);
        }

        function showFailureUI() {
            document.getElementById('pay-btn').style.display = 'none';
            const statusDiv = document.getElementById('status-container');
            statusDiv.className = 'status-box fail-box';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `
                <div>❌ Payment Incomplete / Cancelled</div>
                <div style="font-size: 11px; margin-top: 4px; color: #666;">Aapka payment poora nahi hua tha.</div>
                <button onclick="startPayment()" class="action-btn btn-retry">🔄 Retry Payment (Dobara Koshish Karein)</button>
                <button onclick="cancelAndReturn()" class="action-btn btn-cancel">🔙 App Par Wapas Jayein</button>
            `;
        }

        async function cancelAndReturn() {
            await syncFirebaseStatus('❌ Payment Failed / Cancelled');
            window.location.href = "manormart://orders";
        }

        function startPayment() {
            const statusDiv = document.getElementById('status-container');
            statusDiv.style.display = 'none';
            document.getElementById('pay-btn').style.display = 'block';

            var options = {
                "key": "rzp_live_TbUQsW8HqKfMkm",
                "amount": Math.round(Number(amountRupees) * 100),
                "currency": "INR",
                "name": "Manormart",
                "description": "Order " + (orderId ? '#' + orderId.slice(-6) : 'Online'),
                "handler": async function (response) {
                    paymentProcessed = true;
                    await syncFirebaseStatus('Order Successful');
                    showSuccessUI(response.razorpay_payment_id);
                },
                "modal": {
                    "ondismiss": function() {
                        if (!paymentProcessed) {
                            showFailureUI();
                        }
                    }
                },
                "prefill": {
                    "name": urlParams.get('name') || "Customer",
                    "email": urlParams.get('email') || "customer@manormart.in",
                    "contact": urlParams.get('phone') || ""
                },
                "theme": {
                    "color": "#4a148c"
                }
            };

            var rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response){
                showFailureUI();
            });
            rzp1.open();
        }

        window.addEventListener('load', () => {
            setTimeout(startPayment, 600);
        });
    </script>
</body>
</html>
