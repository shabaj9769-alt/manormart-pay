<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manor Mart – Online Grocery Delivery</title>
<meta name="theme-color" content="#4a148c">
<style>
:root{--p:#4a148c;--p2:#6a1b9a;--pl:#f3e8fb;--g:#1b8a3a;--r:#c62828;--bg:#f6f4f9;--card:#fff;--tx:#1c1c1c;--mu:#6f6f7b;--bd:#e8e4ee}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
button{font:inherit;cursor:pointer;border:0}input,textarea{font:inherit}svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hdr{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;position:sticky;top:0;z-index:20;border-radius:0 0 22px 22px;padding:12px 16px 14px}
.hin{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.5px;font-size:19px}
.addr{flex:1;min-width:120px;background:rgba(255,255,255,.14);border-radius:10px;padding:7px 11px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-align:left}
.pill{background:#ffd54f;color:var(--p);font-weight:800;font-size:12px;padding:7px 12px;border-radius:99px;display:flex;gap:5px;align-items:center}
.dnav{display:none;gap:4px}.dnav button{background:none;color:#e9d7f7;padding:8px 14px;border-radius:10px;font-weight:600}.dnav button.on{background:rgba(255,255,255,.18);color:#fff}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(60,20,100,.12);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;background:none;color:#8a8794;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}.bnav button.on{color:var(--p)}
.bnav button.on:before{content:"";position:absolute;top:-8px;width:34px;height:3px;border-radius:3px;background:var(--p)}
.wrap{max-width:1100px;margin:auto;padding:14px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
.sec{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}.sec svg{color:var(--p2)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:0 14px;margin-bottom:12px}.search input{flex:1;border:0;outline:0;padding:13px 0;background:none}
.banner{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;border-radius:18px;margin-bottom:14px;scrollbar-width:none}.banner img{scroll-snap-align:center;width:100%;max-width:100%;height:170px;object-fit:cover;border-radius:18px;flex:none}
.note{background:#fff3e0;color:#d84315;font-weight:600;font-size:13px;border-radius:12px;padding:10px;text-align:center;margin-bottom:12px}.closed{background:var(--r);color:#fff;text-align:center;padding:10px;font-weight:700;font-size:13px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px}.cat{background:none;text-align:center;font-size:12px;font-weight:700;color:var(--tx)}
.cat .c{width:74px;height:74px;border-radius:50%;background:var(--pl);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px}.c img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pr{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;position:relative}.pr.so{opacity:.55}
.pr .im{aspect-ratio:1;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}.im img{width:100%;height:100%;object-fit:contain}
.off{position:absolute;top:8px;left:8px;background:var(--g);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px}
.pn{font-weight:700;font-size:13.5px;margin-top:8px;line-height:1.25}.pu{font-size:12px;color:var(--mu);margin:2px 0}.pp{font-weight:800;margin:4px 0 8px}.pp s{font-weight:400;font-size:12px;color:#999;margin-left:5px}
.add{margin-top:auto;border:1.5px solid var(--g);background:#fff;color:var(--g);font-weight:800;border-radius:10px;padding:8px}.add:disabled{border-color:#bbb;color:#888}
.qty{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--g);color:#fff;border-radius:10px;font-weight:800}.qty button{background:none;color:#fff;font-size:20px;padding:5px 14px}
.back{white-space:nowrap;background:var(--pl);color:var(--p);font-weight:800;border-radius:99px;padding:8px 14px;font-size:13px}
.fcart{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:700px;margin:auto;background:var(--g);color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:15;box-shadow:0 8px 24px rgba(27,138,58,.35)}
.fcart button{background:#fff;color:var(--g);font-weight:800;border-radius:10px;padding:9px 14px}
.btn{background:var(--p);color:#fff;font-weight:700;border-radius:12px;padding:12px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.g{background:var(--g)}.btn.o{background:#fff;color:var(--p);border:1.5px solid var(--p)}.btn.d{background:#fff;color:var(--r);border:1.5px solid var(--r)}.btn.w{width:100%}.btn:disabled{opacity:.55}
label{display:block;font-size:12px;font-weight:700;color:#444;margin:12px 0 5px}.in{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:12px 13px;background:#fff;outline:0}.in:focus{border-color:var(--p2);box-shadow:0 0 0 3px #6a1b9a22}.in[readonly]{background:#f5f4f7;color:#777}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff;border:1.5px solid var(--bd);color:var(--p2);font-weight:700;border-radius:10px;padding:9px 12px;font-size:12.5px}.chip.on{background:var(--p2);border-color:var(--p2);color:#fff}
.ord{border-left:5px solid var(--g)}.ord.pend{border-color:#e65100}.ord.can{border-color:var(--r)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:#c8e6c9;color:#1b5e20}.tag.on{background:#e1bee7;color:var(--p)}
.steps{display:flex;margin:12px 0;background:var(--pl);padding:10px 6px;border-radius:12px}.stp{flex:1;text-align:center;font-size:10.5px;color:#777}.stp i{display:block;width:22px;height:22px;border-radius:50%;background:#ccc;color:#fff;font-style:normal;font-size:11px;line-height:22px;margin:0 auto 4px;font-weight:700}.stp.d{color:var(--p)}.stp.d i{background:var(--p2)}
.items{background:var(--bg);border-radius:12px;padding:10px;font-size:12.5px;line-height:1.7}
/* profile */
.phero{background:linear-gradient(135deg,var(--p),#7b1fa2);color:#fff;border:0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.av{width:68px;height:68px;border-radius:50%;background:#fff;color:var(--p);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #ffffff40}
.phero h2{font-size:20px}.phero p{opacity:.85;font-size:13px;margin-top:3px}.stats{display:flex;gap:10px;margin-left:auto}.st{background:#ffffff1f;border-radius:12px;padding:8px 14px;text-align:center}.st b{display:block;font-size:18px}.st span{font-size:11px;opacity:.85}
.pg{display:grid;gap:14px}.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}.ph p{font-size:12.5px;color:var(--mu);margin-top:2px}
.ico{width:38px;height:38px;border-radius:12px;background:var(--pl);color:var(--p2);display:flex;align-items:center;justify-content:center}
.ad{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--bd);border-radius:12px;padding:11px;margin-top:8px;font-size:13px}.ad.on{border-color:var(--p2);background:#faf5fd}.ad span{flex:1;cursor:pointer}.ad button{background:none;color:#999;padding:2px}.ad button:hover{color:var(--r)}
.lk{display:flex;align-items:center;gap:12px;width:100%;background:none;text-align:left;padding:14px 0;border-top:1px solid var(--bd);font-weight:600}.lk:first-of-type{border:0}.lk small{display:block;color:var(--mu);font-weight:400;font-size:12px}.lk svg:last-child{margin-left:auto;color:#aaa}
.danger{border-color:#f3c4c8}.danger .sec,.danger .sec svg{color:var(--r)}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;color:#888;padding:6px}
.bar{height:4px;border-radius:4px;background:#e5e0ea;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;transition:.3s}
/* modal / toast / auth */
.ov{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}.md{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}
.md h3{font-size:18px;margin-bottom:10px}.md.full{max-width:720px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:11px 18px;border-radius:12px;z-index:99;font-size:13px;max-width:90%;box-shadow:0 6px 20px #0004}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--p),var(--p2) 55%,#9c27b0)}.auth .card{width:100%;max-width:400px;padding:28px}
.auth h1{text-align:center;font-size:24px;color:var(--p)}.auth .sub{text-align:center;color:var(--mu);font-size:13px;margin:4px 0 8px}.lnk{background:none;color:var(--p2);font-weight:700;font-size:13px;padding:10px;width:100%}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}.tr{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0}.tr.t{font-weight:800;color:var(--p);border-top:1px dashed #ccc;margin-top:6px;padding-top:8px;font-size:15px}
.pol h4{color:var(--p);margin:14px 0 4px;font-size:14px}.pol li{font-size:13px;margin:4px 0 4px 18px;color:#444}
@media(min-width:800px){body{padding-bottom:20px}.bnav{display:none}.dnav{display:flex}.ov{align-items:center}.md{border-radius:22px}.fcart{bottom:20px}.toast{bottom:30px}.pg{grid-template-columns:1fr 1fr;align-items:start}.pg .full{grid-column:1/-1}.banner img{height:260px}}
@media(max-width:600px){
.hdr{padding:8px 10px 10px;border-radius:0 0 16px 16px}.hin{gap:8px;flex-wrap:nowrap}.brand{font-size:14px;white-space:nowrap}
.addr{min-width:0;font-size:12px;padding:6px 9px}.pill{font-size:10.5px;padding:5px 9px}.pill svg{display:none}
.wrap{padding:10px}.card{padding:14px;border-radius:14px}.banner img{height:130px}
.cats{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cat .c{width:64px;height:64px;font-size:24px}.cat{font-size:11.5px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pr{padding:8px;border-radius:14px}.pn{font-size:13px}.pp{margin:3px 0 7px}.add{padding:7px}
.phero{gap:12px}.stats{margin-left:0;width:100%}.st{flex:1}.md{padding:16px}.fcart{left:10px;right:10px}
}
</style></head><body>
<div id="app"></div><div id="modal"></div>
<script>
const API="https://manormart-pay.vercel.app/api",TKEY="manor_customer_session";
const I={shop:'<svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>',orders:'<svg viewBox="0 0 24 24"><path d="m21 8-9-5-9 5v8l9 5 9-5zM3.3 7 12 12l8.7-5M12 22V12"/></svg>',user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',pin:'<svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',lock:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',doc:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8"/></svg>',out:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',eye:'<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',chev:'<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',cart:'<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',shield:'<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',warn:'<svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'};
const S={set:{store:'MANOR MART',minOrd:'0',expDeliveryTime:'45 Mins',normCharge:'0',expCharge:'30',freeDel:'0',hubLat:'19.7244',hubLng:'72.9097',radiusKm:'2',adminNote:'',b1:'',b2:'',b3:'',storeOpen:true,upi:''},cats:{},cart:JSON.parse(localStorage.mm_cart||'{}'),user:null,orders:[],tab:'shop',cat:'',q:'',signup:false,lat:19.7244,lng:72.9097,gps:'Locating…',dist:0,inRange:true,dtype:'Normal',shift:'Morning (8 AM - 11 AM)',pay:'COD',hidden:JSON.parse(localStorage.mm_hidden||'[]'),addrs:[],addr:'',name:'',pwForm:false,sub:0};
const $=s=>document.querySelector(s),r2=n=>Math.round((Number(n)||0)*100)/100,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tok=()=>localStorage.getItem(TKEY);
function toast(m){m=/abort/i.test(String(m))?"Slow network. Please try again.":m;document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
async function api(path,o={},auth=true){const h={...(o.headers||{})};if(o.body)h['Content-Type']='application/json';if(auth&&tok())h.Authorization='Bearer '+tok();const c=new AbortController(),t=setTimeout(()=>c.abort(),30000);try{const res=await fetch(API+path,{...o,headers:h,signal:c.signal});if(res.status===401&&auth&&S.user){localStorage.removeItem(TKEY);S.user=null;toast('Session expired. Please log in again.');draw()}return res}finally{clearTimeout(t)}}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
function modal(html,full){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="md ${full?'full':''}">${html}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
function confirmM(title,msg,yes,fn,danger){window._cf=fn;modal(`<h3>${title}</h3><p style="color:#555;font-size:14px;margin-bottom:16px">${msg}</p><div class="row"><button class="btn o" onclick="closeM()">Cancel</button><button class="btn ${danger?'':'g'}" style="${danger?'background:var(--r)':''}" onclick="closeM();_cf()">${yes}</button></div>`)}
function pEntries(c){return Object.keys(c||{}).filter(k=>!['status','image','discountPercent'].includes(k)&&c[k]&&c[k].name).map(k=>({...c[k],id:k}))}
/* data */
async function loadStore(){try{const[a,b]=await Promise.all([fetch(API+'/settings').then(r=>r.json()),fetch(API+'/catalog').then(r=>r.json())]);let ch=false;if(a&&!a.error){const n={...S.set,...a};if(JSON.stringify(n)!==JSON.stringify(S.set)){S.set=n;ch=true}}if(b&&!b.error&&JSON.stringify(b)!==JSON.stringify(S.cats)){S.cats=b;ch=true}if(ch&&S.user&&S.tab==='shop')drawShop();else if(ch&&!S.user)draw()}catch(e){}}
async function loadOrders(){if(!S.user)return;try{const r=await api('/orders-manager?phone='+S.user.phone);const d=await r.json();let o=!d||d.error?[]:Object.keys(d).map(k=>({id:k,...d[k]})).sort((a,b)=>b.timestamp-a.timestamp);if(JSON.stringify(o)!==JSON.stringify(S.orders)){S.orders=o;if(S.tab==='orders')drawOrders();if(S.tab==='profile')drawProfile()}}catch(e){}}
function geo(){const done=()=>{const R=6371,la=Number(S.set.hubLat)||19.7244,ln=Number(S.set.hubLng)||72.9097,rad=Number(S.set.radiusKm)||2,rd=x=>x*Math.PI/180,dl=rd(S.lat-la),dn=rd(S.lng-ln),a=Math.sin(dl/2)**2+Math.cos(rd(la))*Math.cos(rd(S.lat))*Math.sin(dn/2)**2;S.dist=r2(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));S.inRange=S.dist<=rad;const e=$('#gps');if(e)e.innerHTML=I.pin+S.gps};
 if(!navigator.geolocation){S.gps='Network';return done()}S.gps='Fetching…';navigator.geolocation.getCurrentPosition(p=>{S.lat=p.coords.latitude;S.lng=p.coords.longitude;S.gps='Active';done()},()=>{S.gps='Network';done()},{enableHighAccuracy:true,timeout:8000})}
/* auth */
async function boot(){const ph=localStorage.mm_phone;if(tok()&&ph){try{const r=await api('/customers?phone='+ph);const d=await r.json();if(r.ok&&!d.error)setUser(ph,d);else{localStorage.removeItem(TKEY)}}catch(e){}}draw();loadStore();geo();
 setInterval(loadStore,8000);setInterval(loadOrders,8000)}
function setUser(ph,d){S.user={phone:ph,name:d.name||''};S.name=d.name||'';S.addr=d.addr||'';S.addrs=Array.isArray(d.addresses)?d.addresses:[];localStorage.mm_phone=ph;loadOrders()}
async function login(){const ph=$('#lp').value.replace(/\D/g,''),pw=$('#lw').value;if(ph.length!==10)return toast('Enter a valid 10-digit mobile number');if(pw.length<8)return toast('Password must be at least 8 characters');const b=$('#lb');b.disabled=true;b.textContent='Signing in…';try{const r=await api('/customer-login',{method:'POST',body:JSON.stringify({phone:ph,password:pw})},false),d=await r.json().catch(()=>({}));if(!r.ok||!d.token){b.disabled=false;b.textContent='Log in';return toast(d.error||'Invalid mobile number or password')}localStorage.setItem(TKEY,d.token);setUser(ph,d.customer||{});draw();toast('Welcome back!')}catch(e){b.disabled=false;b.textContent='Log in';toast('Network error. Please try again.')}}
async function signup(){const n=$('#sn').value.trim().replace(/\s+/g,' '),ph=$('#sp').value.replace(/\D/g,''),pw=$('#sw').value;if(!n)return toast('Please enter your full name');if(ph.length!==10)return toast('Enter a valid 10-digit mobile number');if(pw.length<8)return toast('Password must be at least 8 characters');const b=$('#sb');b.disabled=true;try{const r=await api('/customer-signup',{method:'POST',body:JSON.stringify({phone:ph,password:pw,name:n})},false),d=await r.json().catch(()=>({}));if(!r.ok||!d.token){b.disabled=false;return toast(d.error||'Sign up failed. Please try again.')}localStorage.setItem(TKEY,d.token);setUser(ph,{...(d.customer||{}),name:(d.customer||{}).name||n});draw();toast('Account created!')}catch(e){b.disabled=false;toast('Network error. Please try again.')}}
function logout(){['mm_phone',TKEY,'mm_cart'].forEach(k=>localStorage.removeItem(k));S.user=null;S.cart={};S.orders=[];S.tab='shop';closeM();draw();toast('Logged out')}
const pwf=(id,ph)=>`<div class="pw"><input class="in" id="${id}" type="password" placeholder="${ph}" autocomplete="${id==='lw'?'current-password':'new-password'}"><button type="button" onclick="const i=$('#${id}');i.type=i.type==='password'?'text':'password'">${I.eye}</button></div>`;
function drawAuth(){const s=S.signup;$('#app').innerHTML=`<div class="auth"><div class="card"><h1>${esc(S.set.store)}</h1><p class="sub">${s?'Create your account to start ordering':'Log in with your mobile number'}</p>${s?`<label>Full name</label><input class="in" id="sn" placeholder="Your full name">`:''}<label>Mobile number</label><input class="in" id="${s?'sp':'lp'}" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><label>Password</label>${pwf(s?'sw':'lw','At least 8 characters')}<button class="btn w" id="${s?'sb':'lb'}" style="margin-top:18px" onclick="${s?'signup()':'login()'}">${s?'Create account':'Log in'}</button>${s?'':`<button class="lnk" onclick="toast('Please contact the store/admin to set a temporary password.')">Forgot password?</button>`}<button class="lnk" onclick="S.signup=!S.signup;drawAuth()">${s?'Already have an account? Log in':'New here? Create an account'}</button><button class="lnk" style="color:#777;font-weight:600" onclick="policy()">Terms, Privacy &amp; Refund Policy</button></div></div>`;
 document.querySelectorAll('.auth input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')s?signup():login()}))}
/* layout */
function draw(){if(!S.user)return drawAuth();const tabs=[['shop','Shop',I.shop],['orders','Orders',I.orders],['profile','Profile',I.user]];
 $('#app').innerHTML=`<div class="hdr"><div class="hin"><div class="brand">${esc(S.set.store)}</div><button class="addr" onclick="go('profile')">${I.pin.replace('<svg','<svg style="vertical-align:-4px;margin-right:6px"')}${esc(S.addr||'Add delivery address')}</button><div class="pill" id="gps">${I.pin}${S.gps}</div><div class="dnav">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div></div></div>${S.set.storeOpen===false?'<div class="closed">Store is currently closed. New orders are temporarily suspended.</div>':''}<div class="wrap" id="view"></div><div id="fc"></div><nav class="bnav">${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[2]}${t[1]}</button>`).join('')}</nav>`;go(S.tab)}
function go(t){S.tab=t;document.querySelectorAll('.bnav button,.dnav button').forEach((b,i)=>b.classList.toggle('on',['shop','orders','profile'][i%3]===t));scrollTo(0,0);({shop:drawShop,orders:()=>{drawOrders();loadOrders()},profile:drawProfile})[t]()}
/* shop */
function cartTotals(){const l=Object.values(S.cart),sub=r2(l.reduce((a,i)=>a+i.effectivePrice*i.qty,0)),f=Number(S.set.freeDel||0),n=Number(S.set.normCharge||0);let fee=f>0&&sub>=f?0:n;if(S.dtype==='Express')fee+=Number(S.set.expCharge||30);return{sub,fee,total:r2(sub+(sub>0?fee:0)),n:l.reduce((a,i)=>a+i.qty,0)}}
function qty(id,cat,d){const p=pEntries(S.cats[cat]).find(x=>x.id===id);if(!p)return;if(p.inStock===false&&d>0)return toast('Sorry, this item is out of stock');const c=S.cart[id]?.qty||0,n=c+d;if(n<=0)delete S.cart[id];else S.cart[id]={id,catName:cat,name:p.name,unit:p.unit||'',price:Number(p.price||0),discount:Number(p.discount||0),effectivePrice:Number(p.price||0)-Number(p.discount||0),qty:n,image:p.image||''};localStorage.mm_cart=JSON.stringify(S.cart);drawGrid();fcart()}
function fcart(){const t=cartTotals(),e=$('#fc');if(!e)return;e.innerHTML=t.sub>0&&S.tab==='shop'&&S.set.storeOpen!==false?`<div class="fcart"><div><b>${t.n} item${t.n>1?'s':''} · ₹${t.sub}</b><div style="font-size:11px;opacity:.85">All taxes included</div></div><button onclick="cartM()">View cart →</button></div>`:''}
function drawShop(){const v=$('#view');if(!v)return;const bn=[S.set.b1,S.set.b2,S.set.b3].filter(b=>b&&b.trim().startsWith('http'));
 v.innerHTML=`<div class="search">${I.shop.replace('<svg','<svg style="color:#999"')}<input id="q" placeholder='Search "rice", "kaju", "tomato"' value="${esc(S.q)}" oninput="S.q=this.value;drawGrid()"></div>${S.set.adminNote?`<div class="note">${esc(S.set.adminNote)}</div>`:''}<div id="grid"></div>`;S.bn=bn;drawGrid();fcart()}
function drawGrid(){const g=$('#grid');if(!g)return;const bn=S.bn||[];let h='';
 if(!S.cat&&!S.q){h+=bn.length?`<div class="banner">${bn.map(b=>`<img src="${esc(b.trim())}" alt="">`).join('')}</div>`:'';h+=`<div class="sec">Shop by category</div><div class="cats">${Object.keys(S.cats).map(c=>{const im=S.cats[c]?.image;return`<button class="cat" data-c="${esc(c)}" onclick="S.cat=this.dataset.c;drawGrid();scrollTo(0,0)"><div class="c">${im&&String(im).startsWith('http')?`<img src="${esc(im)}" alt="">`:'🛍️'}</div>${esc(c)}</button>`}).join('')||'<div class="empty">Loading store…</div>'}</div>`}
 else{let items=[];if(S.q)Object.keys(S.cats).forEach(c=>pEntries(S.cats[c]).forEach(p=>{if(p.name.toLowerCase().includes(S.q.toLowerCase()))items.push({...p,catName:c})}));else items=pEntries(S.cats[S.cat]).map(p=>({...p,catName:S.cat}));
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><button class="back" onclick="S.cat='';S.q='';$('#q').value='';drawGrid()">‹ Back</button><b style="color:var(--p)">${S.q?'Search: '+esc(S.q):esc(S.cat)}</b></div>`;
  h+=items.length?`<div class="grid">${items.map(p=>{const ef=r2(p.price-(p.discount||0)),q=S.cart[p.id]?.qty||0,d=Number(p.discount||0),so=p.inStock===false,pct=d>0&&p.price>0?Math.round(d/p.price*100):0,a=`'${esc(p.id)}','${esc(p.catName).replace(/'/g,"\\'")}'`;
   return`<div class="pr ${so?'so':''}">${pct?`<div class="off">${pct}% OFF</div>`:''}<div class="im">${p.image&&String(p.image).startsWith('http')?`<img loading="lazy" src="${esc(p.image.trim())}" alt="">`:'📦'}</div><div class="pn">${esc(p.name)}</div><div class="pu">${esc(p.unit||'')}</div><div class="pp">₹${ef}${d>0?`<s>₹${p.price}</s>`:''}</div>${so?'<button class="add" disabled>Sold out</button>':S.set.storeOpen===false?'<button class="add" disabled>Store closed</button>':q?`<div class="qty"><button onclick="qty(${a},-1)">−</button>${q}<button onclick="qty(${a},1)">+</button></div>`:`<button class="add" onclick="qty(${a},1)">ADD</button>`}</div>`}).join('')}</div>`:'<div class="empty">No products found.</div>'}
 g.innerHTML=h}
/* cart & checkout */
function cartM(){const t=cartTotals(),l=Object.values(S.cart);if(!l.length){closeM();return}
 modal(`<div class="oh"><h3>My cart</h3><button class="back" onclick="closeM()">Close</button></div>${l.map(i=>`<div class="tr" style="align-items:center;border-bottom:1px solid var(--bd);padding:8px 0"><div><b>${esc(i.name)}</b> <small style="color:#777">(${esc(i.unit)})</small><div style="font-size:12px;color:#777">₹${r2(i.effectivePrice)} × ${i.qty} = ₹${r2(i.effectivePrice*i.qty)}</div></div><div class="qty" style="margin:0;min-width:96px"><button onclick="cq('${esc(i.id)}',-1)">−</button>${i.qty}<button onclick="cq('${esc(i.id)}',1)">+</button></div></div>`).join('')}
 <label>Full name</label><input class="in" id="cn" value="${esc(S.name)}"><label>Mobile</label><input class="in" value="${esc(S.user.phone)}" readonly><label>Delivery address</label><textarea class="in" id="ca" rows="2" placeholder="House no, landmark, area, town">${esc(S.addr)}</textarea>
 ${S.addrs.length?`<div class="chips" style="margin-top:8px">${S.addrs.map((a,i)=>`<button class="chip" onclick="$('#ca').value=S.addrs[${i}]">${esc(a.slice(0,32))}</button>`).join('')}</div>`:''}
 <label>Delivery speed</label><div class="chips">${['Normal','Express'].map(x=>`<button class="chip ${S.dtype===x?'on':''}" onclick="S.dtype='${x}';keep();cartM()">${x==='Express'?'Express ('+esc(S.set.expDeliveryTime)+')':'Normal'}</button>`).join('')}</div>
 <label>Delivery shift</label><div class="chips">${['Morning (8 AM - 11 AM)','Evening (4 PM - 8 PM)'].map(x=>`<button class="chip ${S.shift===x?'on':''}" onclick="S.shift='${x}';keep();cartM()">${x}</button>`).join('')}</div>
 <label>Payment</label><div class="note" style="margin:0;text-align:left;background:#e8f5e9;color:#1b5e20">💵 Cash on delivery — pay when your order arrives</div>
 <div style="margin-top:16px"><div class="tr"><span>Subtotal</span><b>₹${t.sub}</b></div><div class="tr"><span>Delivery fee</span><b>₹${t.fee}</b></div><div class="tr t"><span>Grand total</span><span>₹${t.total}</span></div></div><button class="btn g w" id="pob" style="margin-top:14px" onclick="place()">Place order · ₹${t.total}</button>`)}
function keep(){S.name=$('#cn')?.value??S.name;S.addr=$('#ca')?.value??S.addr}
function cq(id,d){const i=S.cart[id];if(!i)return;keep();i.qty+=d;if(i.qty<=0)delete S.cart[id];localStorage.mm_cart=JSON.stringify(S.cart);drawGrid();fcart();cartM()}
async function place(){keep();const l=Object.values(S.cart),t=cartTotals(),name=S.name.trim().replace(/\s+/g,' '),addr=S.addr.trim().replace(/\s+/g,' ');
 if(S.set.storeOpen===false)return toast('Store is closed right now');if(!name)return toast('Please enter your full name');if(!addr)return toast('Please enter your delivery address');
 if(!S.inRange)return toast(`We deliver within ${S.set.radiusKm} KM of the store. You are ${S.dist} KM away.`);const mo=Number(S.set.minOrd||0);if(mo>0&&t.sub<mo)return toast('Minimum order is ₹'+mo);
 const b=$('#pob');b.disabled=true;b.textContent='Placing order…';
 try{const lc=await fetch(API+'/catalog').then(r=>r.json()),notes=[];if(lc&&!lc.error){const nv={};l.forEach(i=>{const lv=pEntries(lc[i.catName]).find(p=>p.id===i.id);if(!lv)return notes.push(i.name+' is no longer available');if(lv.inStock===false)return notes.push(i.name+' is out of stock');const ef=Number(lv.price||0)-Number(lv.discount||0);if(r2(ef)!==r2(i.effectivePrice))notes.push(`${i.name}: price is now ₹${r2(ef)}`);nv[i.id]={...i,name:lv.name,unit:lv.unit||i.unit,price:Number(lv.price),discount:Number(lv.discount||0),effectivePrice:ef}});
   if(notes.length){S.cart=nv;S.cats=lc;localStorage.mm_cart=JSON.stringify(nv);b.disabled=false;cartM();return toast('Cart updated: '+notes.join('; ')+'. Please review and order again.')}}
  const ts=Date.now(),id='ord_'+ts+'_'+Math.floor(Math.random()*1000),o={id,name,phone:S.user.phone,addr,lat:S.lat,lng:S.lng,distance:S.dist,items:S.cart,subtotal:t.sub,deliveryFee:t.fee,total:t.total,deliveryType:S.dtype,deliveryShift:S.shift,payment:'COD',deliveryStatus:'Order Successful',assignedBoy:'',deliveryBoyPhone:'',timestamp:ts};
  const res=await post('/orders-manager',{action:'createOrder',orderData:o});if(!res.ok)throw 0;
  post('/customers',{action:'updateProfile',phone:S.user.phone,name,addr}).catch(()=>{});S.user.name=name;S.cart={};localStorage.mm_cart='{}';closeM();
  go('orders');loadOrders();toast('Order #'+id.slice(-6)+' placed successfully!')
 }catch(e){const bb=$('#pob');if(bb){bb.disabled=false;bb.textContent='Place order'}toast('Unable to place order. Please check your connection and try again.')}}
/* orders */
const eff=o=>{const s=o.deliveryStatus||'';return /Pending/.test(s)?'Order Successful':s};
function drawOrders(){const v=$('#view');if(!v)return;const l=S.orders.filter(o=>!S.hidden.includes(o.id));
 v.innerHTML=`<div class="oh" style="margin-bottom:12px"><div class="sec" style="margin:0">Your orders</div><button class="back" onclick="loadOrders();toast('Refreshed')">Refresh</button></div>`+(l.length?l.map(o=>{const st=eff(o),pend=false,can=(o.deliveryStatus||'').includes('Cancelled'),idx=['Order Successful','Assigned','Out for Delivery','Delivered'].indexOf(st),dt=o.timestamp?new Date(Number(o.timestamp)).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}):'';
  return`<div class="card ord ${pend?'pend':can?'can':''}"><div class="oh"><b>Order #${esc(o.id.slice(-6))}</b><div style="display:flex;gap:8px;align-items:center"><span class="tag ${o.payment==='Online'?'on':''}">${o.payment==='Online'?'Online':'COD'}</span><b>₹${o.total}</b></div></div><div style="font-size:12px;color:#777;margin-top:4px">${dt}</div>
  ${can?`<div style="color:var(--r);font-weight:700;font-size:13px;margin:10px 0">${esc(st)}</div>`:`<div class="steps">${['Order placed','Assigned','Out for delivery','Delivered'].map((n,i)=>`<div class="stp ${i<=Math.max(idx,0)?'d':''}"><i>${i<=Math.max(idx,0)?'✓':i+1}</i>${n}</div>`).join('')}</div>`}
  ${o.assignedBoy?`<div style="background:#eefaf0;border:1px solid #bfe6c7;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px"><b style="color:#1b5e20">Delivery partner:</b> ${esc(o.assignedBoy)}${o.deliveryBoyPhone?` · <a href="tel:${esc(o.deliveryBoyPhone)}" style="color:var(--g);font-weight:700">Call ${esc(o.deliveryBoyPhone)}</a>`:''}</div>`:''}
  <div class="items">${Object.values(o.items||{}).map(i=>`${esc(i.name)} (${esc(i.unit)}) × ${i.qty} — ₹${r2(i.effectivePrice*i.qty)}`).join('<br>')}</div>
  <div class="row" style="margin-top:12px">${!can&&!/Delivered|Out for Delivery/.test(o.deliveryStatus||'')?`<button class="btn d" onclick="cancelO('${esc(o.id)}','${esc(o.payment)}','${pend?1:0}')">Cancel order</button>`:''}${can||/Delivered/.test(o.deliveryStatus||'')?`<button class="btn o" onclick="hideO('${esc(o.id)}')">Remove from list</button>`:''}</div></div>`}).join(''):`<div class="empty card"><div style="font-size:46px">🛵</div><h3 style="margin:8px 0 4px;color:var(--tx)">No orders yet</h3><p>Your orders and live tracking will show up here.</p><button class="btn g" style="margin-top:14px" onclick="go('shop')">Start shopping</button></div>`)}
async function chk(id){try{const d=await api('/orders-manager?orderId='+encodeURIComponent(id)).then(r=>r.json());toast(d&&d.paymentVerified===true?'Payment verified!':'Payment is still unverified. Try again shortly.');loadOrders()}catch(e){toast('Network error')}}
function cancelO(id,pay,pend){confirmM('Cancel this order?',pay==='Online'&&pend!=='1'?'Prepaid refunds are credited to your original payment method within 5 to 7 business days.':'This cannot be undone.','Yes, cancel',async()=>{try{const r=await post('/orders-manager',{action:'cancelCustomerOrder',orderId:id}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error);toast('Order cancelled');loadOrders()}catch(e){toast(e.message||'Could not cancel. Please try again.')}},1)}
function hideO(id){S.hidden.push(id);localStorage.mm_hidden=JSON.stringify(S.hidden);drawOrders()}
/* profile */
function strength(v){let s=0;if(v.length>=8)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v)||v.length>=12)s++;const e=$('#sbar');if(e){e.style.width=s*25+'%';e.style.background=['#ccc','#e53935','#fb8c00','#fdd835','#43a047'][s]}}
function drawProfile(){const v=$('#view');if(!v)return;const n=S.orders.length,sp=r2(S.orders.filter(o=>!/Cancelled/.test(o.deliveryStatus||'')).reduce((a,o)=>a+Number(o.total||0),0));
 v.innerHTML=`<div class="card phero"><div class="av">${esc((S.name||'U').trim().charAt(0).toUpperCase())}</div><div><h2>${esc(S.name||'Your name')}</h2><p>+91 ${esc(S.user.phone)}</p></div><div class="stats"><div class="st"><b>${n}</b><span>Orders</span></div><div class="st"><b>₹${sp}</b><span>Spent</span></div></div></div>
 <div class="pg"><div class="card"><div class="ph"><div class="sec"><div class="ico">${I.user}</div>Personal information</div></div><p style="font-size:12.5px;color:var(--mu)">Your name is used on delivery slips.</p><label>Full name</label><input class="in" id="pn" value="${esc(S.name)}" placeholder="Enter your full name"><label>Mobile number</label><input class="in" value="${esc(S.user.phone)}" readonly><button class="btn w" style="margin-top:16px" onclick="saveP()">Save changes</button></div>
 <div class="card"><div class="ph"><div class="sec"><div class="ico">${I.pin}</div>Delivery addresses</div></div><label>Current delivery address</label><textarea class="in" id="pa" rows="2" placeholder="House no, landmark, area, town">${esc(S.addr)}</textarea><button class="btn o w" style="margin-top:10px" onclick="saveA()">${I.plus}Save this address</button>${S.addrs.map((a,i)=>`<div class="ad ${a===S.addr?'on':''}">${I.pin}<span onclick="S.addr=S.addrs[${i}];drawProfile();draw2()">${esc(a)}</span><button title="Remove" onclick="delA(${i})">${I.x}</button></div>`).join('')}</div>
 <div class="card"><div class="ph"><div class="sec"><div class="ico">${I.lock}</div>Password &amp; security</div></div>${S.pwForm?`<label>Current password</label>${pwf('op','Current password')}<label>New password</label>${pwf('np','At least 8 characters')}<div class="bar"><i id="sbar"></i></div><div class="row" style="margin-top:14px"><button class="btn o" onclick="S.pwForm=false;drawProfile()">Cancel</button><button class="btn g" onclick="chPw()">Update</button></div>`:`<button class="btn w" style="margin-top:8px" onclick="S.pwForm=true;drawProfile();$('#np').oninput=e=>strength(e.target.value)">Change password</button>`}<p style="font-size:12px;color:var(--mu);margin-top:12px">Forgot your password? Contact the store. For security, passwords are never reset using only a mobile number.</p></div>
 <div class="card"><div class="ph"><div class="sec"><div class="ico">${I.shield}</div>Help &amp; legal</div></div><button class="lk" onclick="policy()">${I.doc}<div>Terms, Privacy &amp; Refund Policy<small>Cash on delivery · data protection</small></div>${I.chev}</button><a class="lk" href="mailto:shabaj9769@gmail.com" style="text-decoration:none;color:inherit">${I.user}<div>Contact support<small>shabaj9769@gmail.com</small></div>${I.chev}</a></div>
 <div class="card danger full"><div class="ph"><div class="sec"><div class="ico" style="background:#fdecea;color:var(--r)">${I.warn}</div>Account</div></div><div class="row"><button class="btn o" onclick="confirmM('Log out?','You can log back in anytime with your mobile number.','Log out',logout)">${I.out}Log out</button><button class="btn d" onclick="delAcc()">${I.trash}Delete my account</button></div></div></div>`}
function draw2(){const b=document.querySelector('.addr');if(b)b.lastChild.textContent=S.addr||'Add delivery address'}
async function saveP(){const n=$('#pn').value.trim().replace(/\s+/g,' ');if(!n)return toast('Please enter your name');S.name=n;S.user.name=n;try{await post('/customers',{action:'updateProfile',phone:S.user.phone,name:n,addr:S.addr});toast('Profile updated');drawProfile()}catch(e){toast('Could not save. Please try again.')}}
async function saveA(){const a=$('#pa').value.trim().replace(/\s+/g,' ');if(!a)return toast('Please enter an address');S.addr=a;if(!S.addrs.includes(a))S.addrs.push(a);try{await post('/customers',{action:'saveAddresses',phone:S.user.phone,addresses:S.addrs});post('/customers',{action:'updateProfile',phone:S.user.phone,name:S.name,addr:a}).catch(()=>{})}catch(e){}toast('Address saved');drawProfile();draw2()}
function delA(i){confirmM('Remove address?','This address will be removed from your saved list.','Remove',async()=>{S.addrs.splice(i,1);try{await post('/customers',{action:'saveAddresses',phone:S.user.phone,addresses:S.addrs})}catch(e){}drawProfile()},1)}
async function chPw(){const o=$('#op').value,n=$('#np').value;if(o.length<8||n.length<8)return toast('Both passwords must be at least 8 characters');if(o===n)return toast('New password must be different');try{const r=await post('/customers',{action:'changePassword',phone:S.user.phone,oldPassword:o,newPassword:n}),d=await r.json().catch(()=>({}));if(!r.ok)return toast(d.error||'Unable to change password');S.pwForm=false;drawProfile();toast('Password updated successfully')}catch(e){toast('Network error')}}
function delAcc(){confirmM('Delete your account?','Your saved data on this device will be cleared and you will be logged out. To permanently erase your account from our servers, we will open an email to the store.','Continue',()=>{location.href='mailto:shabaj9769@gmail.com?subject=Account%20deletion%20request&body=Please%20delete%20my%20Manor%20Mart%20account%20for%20mobile%20'+S.user.phone;localStorage.clear();logout()},1)}
function policy(){modal(`<div class="pol"><h3 style="color:var(--p)">MANOR MART — Terms, Privacy &amp; Refund Policy</h3><small style="color:#777">Last updated: September 2026</small><h4>1. About our service &amp; coverage</h4><ul><li>Manor Mart is a hyper-local quick-commerce grocery ordering and delivery platform serving Manor, Palghar, Maharashtra.</li><li>Deliveries operate strictly within geo-fenced boundaries set by the store.</li></ul><h4>2. Cancellation &amp; refund (5 to 7 days)</h4><ul><li>You can cancel an order before dispatch ("Out for Delivery").</li><li>We accept Cash on Delivery only. You pay the delivery partner when your order arrives.</li></ul><h4>3. Privacy &amp; data protection</h4><ul><li>We collect phone number, name, delivery address and GPS coordinates solely for delivery routing and geofencing.</li><li>We never sell, rent or trade personal data.</li><li>You may delete your saved details or account from Profile.</li></ul><h4>4. Grievance &amp; support</h4><ul><li>Business: Manor Mart, Manor, Palghar, Maharashtra - 401403</li><li>Email: shabaj9769@gmail.com</li></ul><button class="btn w" style="margin-top:18px" onclick="closeM()">Close</button></div>`,1)}
boot();
</script></body></html>
