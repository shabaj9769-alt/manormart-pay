<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manor Mart Alert & Broadcast</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f3e5f5; color: #333; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .header { width: 100%; max-width: 450px; background: #4a148c; color: #fff; padding: 16px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .header h1 { font-size: 18px; margin-bottom: 4px; }
    .status-badge { display: inline-block; background: #ffd54f; color: #4a148c; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; margin-top: 6px; }
    .active-service-btn { margin-top: 12px; width: 100%; max-width: 450px; background: #2e7d32; color: #fff; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    
    /* Siren Alert Box */
    .siren-alert-card { width: 100%; max-width: 450px; background: #d32f2f; color: #fff; border-radius: 12px; padding: 22px; margin-top: 15px; text-align: center; animation: pulse 0.8s infinite alternate; display: none; }
    @keyframes pulse { from { transform: scale(0.98); opacity: 0.9; } to { transform: scale(1.02); opacity: 1; } }
    .siren-alert-card h2 { font-size: 22px; margin-bottom: 8px; }
    .mute-btn { background: #fff; color: #d32f2f; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
    
    /* Broadcast Box */
    .broadcast-card { width: 100%; max-width: 450px; background: #fff; border-radius: 12px; padding: 16px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 4px solid #6a1b9a; }
    .broadcast-card h3 { font-size: 14px; color: #4a148c; margin-bottom: 10px; }
    .input-box { width: 100%; padding: 10px; border: 1px solid #ce93d8; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
    .send-offer-btn { width: 100%; background: #6a1b9a; color: #fff; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    
    .order-history { width: 100%; max-width: 450px; margin-top: 16px; }
    .order-card { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #6a1b9a; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
  </style>
</head>
<body>

  <div class="header">
    <h1>🛒 Manor Mart Store Terminal</h1>
    <div id="serviceStatus" class="status-badge">⚠️ Button Daba Kar Bell Chalu Karein</div>
  </div>

  <button id="startBtn" class="active-service-btn" onclick="startOrderListener()">
    🔊 Bell Service Activate Karein
  </button>

  <!-- LOUD CONTINUOUS SIREN CARD -->
  <div id="sirenCard" class="siren-alert-card">
    <h2>🚨 NAYA ORDER AAYA HAI! 🚨</h2>
    <p id="sirenDetails" style="font-size: 15px; font-weight: bold; margin-top: 6px;"></p>
    <button class="mute-btn" onclick="stopSiren()">🔕 Awaz Band Karein (Order Check Kiya)</button>
  </div>

  <!-- INSTANT PUSH OFFER BROADCASTER -->
  <div class="broadcast-card">
    <h3>📢 Customer Ko Instant Offer Notification Bhejo</h3>
    <input id="offerTitle" class="input-box" type="text" placeholder="Offer Title (e.g. Sham Ka Bumper Discount! 🔥)" />
    <textarea id="offerBody" class="input-box" style="height: 60px;" placeholder="Message (e.g. Sabhi Groceries par 15% discount!)"></textarea>
    <button id="broadcastBtn" class="send-offer-btn" onclick="sendBroadcastOffer()">🚀 Broadcast Offer to All Customers</button>
    <div id="sendResult" style="font-size: 12px; font-weight: bold; margin-top: 8px; text-align: center;"></div>
  </div>

  <!-- RECENT ORDERS LIST -->
  <div class="order-history">
    <h3 style="font-size: 13px; color: #6a1b9a; margin-bottom: 8px;">📋 Recent Live Orders</h3>
    <div id="ordersList">
      <div style="text-align: center; color: #777; font-size: 12px; padding: 20px;">Waiting for orders...</div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://manorbiryani-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let audioCtx = null;
    let sirenInterval = null;
    let isServiceActive = false;
    let wakeLock = null;
    let appStartTime = Date.now() - 30000;

    // 1. Screen WakeLock Engine (Screen ko khud band nahi hone dega)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("WakeLock Note:", err);
      }
    }

    // 2. Auto-Resume when Screen is turned ON again
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && isServiceActive) {
        // Audio resume karein
        if (audioCtx && audioCtx.state === 'suspended') {
          try { await audioCtx.resume(); } catch(e){}
        }
        // WakeLock dubara lagayein
        await requestWakeLock();
        
        // Status badge ko active show karein
        const badge = document.getElementById('serviceStatus');
        badge.textContent = "🟢 Live Bell Online";
        badge.style.background = "#c8e6c9";
        badge.style.color = "#1b5e20";
      }
    });

    // 3. Siren Tone Engine
    function playBeepTone(freq, duration) {
      if (!audioCtx) return;
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function triggerLoudSiren() {
      if (sirenInterval) return;
      let highTone = true;
      if (navigator.vibrate) navigator.vibrate([600, 300, 600, 300, 600]);
      
      sirenInterval = setInterval(() => {
        if (highTone) {
          playBeepTone(1000, 0.22);
        } else {
          playBeepTone(650, 0.22);
        }
        highTone = !highTone;
        if (navigator.vibrate) navigator.vibrate(200);
      }, 280);
    }

    function stopSiren() {
      if (sirenInterval) {
        clearInterval(sirenInterval);
        sirenInterval = null;
      }
      document.getElementById('sirenCard').style.display = 'none';
    }

    // 4. Bell Activate Function
    async function startOrderListener() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      isServiceActive = true;
      await requestWakeLock();

      document.getElementById('startBtn').style.display = 'none';
      const badge = document.getElementById('serviceStatus');
      badge.textContent = "🟢 Live Bell Online";
      badge.style.background = "#c8e6c9";
      badge.style.color = "#1b5e20";

      // Testing short beep to confirm speaker unlock
      playBeepTone(800, 0.15);

      // Listen for fresh orders
      db.ref("orders").on("child_added", (snapshot) => {
        const order = snapshot.val();
        if (!order) return;

        let orderTs = Number(order.timestamp || snapshot.key.replace(/[^0-9]/g, '')) || Date.now();

        if (orderTs > appStartTime) {
          document.getElementById('sirenCard').style.display = 'block';
          document.getElementById('sirenDetails').textContent = 
            `Order #${snapshot.key.slice(-6)} | ₹${order.total || '0'} | ${order.name || 'Customer'}`;
          triggerLoudSiren();
        }

        renderOrderCard(snapshot.key, order);
      });
    }

    function renderOrderCard(orderId, order) {
      const container = document.getElementById('ordersList');
      if (container.innerHTML.includes("Waiting for orders...")) {
        container.innerHTML = "";
      }
      const card = document.createElement('div');
      card.className = 'order-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px; color:#4a148c;">
          <span>#${orderId.slice(-6)}</span>
          <span style="color:#2e7d32;">₹${order.total || '0'}</span>
        </div>
        <div style="font-size:11.5px; color:#555; margin-top:3px;">👤 ${order.name || 'Customer'} (${order.phone || ''})</div>
        <div style="font-size:11px; color:#777;">📍 ${order.addr || 'Address not given'}</div>
      `;
      container.prepend(card);
    }

    // 5. Instant Broadcast Push Engine
    async function sendBroadcastOffer() {
      const title = document.getElementById('offerTitle').value.trim();
      const body = document.getElementById('offerBody').value.trim();
      const resBox = document.getElementById('sendResult');

      if (!title || !body) {
        alert("Kripya Offer Title aur Message dono bharein!");
        return;
      }

      resBox.style.color = "#6a1b9a";
      resBox.textContent = "⏳ Customer list check ho rahi hai...";

      try {
        const snap = await db.ref("customerTokens").once("value");
        const tokensData = snap.val();

        if (!tokensData) {
          resBox.style.color = "#c62828";
          resBox.textContent = "Koi customer registered nahi mila!";
          return;
        }

        let pushTokens = [];
        Object.values(tokensData).forEach(item => {
          let tk = item?.token || item;
          if (typeof tk === 'string' && tk.startsWith('ExponentPushToken')) {
            if (!pushTokens.includes(tk)) pushTokens.push(tk);
          }
        });

        if (pushTokens.length === 0) {
          resBox.style.color = "#c62828";
          resBox.textContent = "Koi active push token nahi mila!";
          return;
        }

        resBox.textContent = `Bhej rahe hain (${pushTokens.length} devices)...`;

        let messages = pushTokens.map(token => ({
          to: token,
          sound: 'default',
          title: title,
          body: body,
          priority: 'high',
          channelId: 'default'
        }));

        await fetch('https://exp.host/--/api/v2/push/send', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Accept-Encoding': 'gzip, deflate',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(messages),
        });

        await db.ref("settings/adminNote").set(`${title}: ${body}`);

        resBox.style.color = "#2e7d32";
        resBox.textContent = `✅ Successfully sent to ${pushTokens.length} customer devices!`;
        document.getElementById('offerTitle').value = '';
        document.getElementById('offerBody').value = '';

      } catch (err) {
        resBox.style.color = "#c62828";
        resBox.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
