<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manor Mart Store Terminal - Alarm</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f3e5f5; color: #333; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center; }
    .header { width: 100%; max-width: 450px; background: #4a148c; color: #fff; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .header h1 { font-size: 20px; margin-bottom: 6px; }
    .status-badge { display: inline-block; background: #ffd54f; color: #4a148c; font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 20px; margin-top: 8px; }
    .active-service-btn { margin-top: 16px; width: 100%; max-width: 450px; background: #2e7d32; color: #fff; border: none; padding: 16px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    
    /* Siren Alert Box */
    .siren-alert-card { width: 100%; max-width: 450px; background: #d32f2f; color: #fff; border-radius: 12px; padding: 24px; margin-top: 15px; text-align: center; animation: pulse 0.8s infinite alternate; display: none; box-shadow: 0 6px 15px rgba(211,47,47,0.4); }
    @keyframes pulse { from { transform: scale(0.98); opacity: 0.9; } to { transform: scale(1.02); opacity: 1; } }
    .siren-alert-card h2 { font-size: 22px; margin-bottom: 10px; }
    .mute-btn { background: #fff; color: #d32f2f; border: none; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 14px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; }
    
    .order-history { width: 100%; max-width: 450px; margin-top: 20px; }
    .order-card { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #6a1b9a; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
  </style>
</head>
<body>

  <!-- Hidden background audio loop to keep browser audio awake -->
  <audio id="silentAudioLoop" loop playsinline style="display:none;"></audio>

  <div class="header">
    <h1>🛒 Manor Mart Store Bell</h1>
    <div id="serviceStatus" class="status-badge">⚠️ Button Daba Kar Alarm Chalu Karein</div>
  </div>

  <button id="startBtn" class="active-service-btn" onclick="startOrderListener()">
    🔊 Alarm Service Activate Karein
  </button>

  <!-- LOUD CONTINUOUS SIREN CARD -->
  <div id="sirenCard" class="siren-alert-card">
    <h2>🚨 NAYA ORDER AAYA HAI! 🚨</h2>
    <p id="sirenDetails" style="font-size: 16px; font-weight: bold; margin-top: 6px;"></p>
    <button class="mute-btn" onclick="stopSiren()">🔕 Awaz Band Karein (Agla Order Suno)</button>
  </div>

  <!-- RECENT LIVE ORDERS -->
  <div class="order-history">
    <h3 style="font-size: 13px; color: #6a1b9a; margin-bottom: 8px;">📋 Recent Terminal Orders</h3>
    <div id="ordersList">
      <div style="text-align: center; color: #777; font-size: 12px; padding: 20px; background: #fff; border-radius: 8px;">Waiting for orders...</div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://manorbiryani-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let audioCtx = null;
    let sirenInterval = null;
    let isServiceActive = false;
    let wakeLock = null;
    let lastCheckedTime = Date.now();

    const SILENT_WAV = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";

    async function ensureAudioActive() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch(e) {}
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    document.addEventListener("visibilitychange", async () => {
      if (isServiceActive) {
        await ensureAudioActive();
        await requestWakeLock();
      }
    });

    window.addEventListener("focus", async () => {
      if (isServiceActive) await ensureAudioActive();
    });

    document.body.addEventListener("click", async () => {
      if (isServiceActive) await ensureAudioActive();
    });

    function playBeepTone(freq, duration) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function triggerLoudSiren() {
      if (sirenInterval) return;
      let highTone = true;
      if (navigator.vibrate) navigator.vibrate([600, 300, 600, 300, 600]);
      
      sirenInterval = setInterval(() => {
        if (highTone) {
          playBeepTone(1050, 0.22);
        } else {
          playBeepTone(650, 0.22);
        }
        highTone = !highTone;
        if (navigator.vibrate) navigator.vibrate(200);
      }, 280);
    }

    function stopSiren() {
      if (sirenInterval) {
        clearInterval(sirenInterval);
        sirenInterval = null;
      }
      document.getElementById('sirenCard').style.display = 'none';
      
      // Update Firebase flag and baseline time
      db.ref("settings/sirenActive").set(false);
      lastCheckedTime = Date.now();
    }

    // Listen for remote mute from Admin App
    db.ref("settings/sirenActive").on("value", (snapshot) => {
      if (snapshot.val() === false) {
        if (sirenInterval) {
          clearInterval(sirenInterval);
          sirenInterval = null;
        }
        document.getElementById('sirenCard').style.display = 'none';
      }
    });

    async function startOrderListener() {
      await ensureAudioActive();

      try {
        const silentAudio = document.getElementById('silentAudioLoop');
        silentAudio.src = SILENT_WAV;
        await silentAudio.play();
      } catch(e) {}

      isServiceActive = true;
      lastCheckedTime = Date.now();
      await requestWakeLock();

      document.getElementById('startBtn').style.display = 'none';
      const badge = document.getElementById('serviceStatus');
      badge.textContent = "🟢 Live Alarm Terminal Online";
      badge.style.background = "#c8e6c9";
      badge.style.color = "#1b5e20";

      playBeepTone(800, 0.15);

      // Listen for fresh incoming orders
      db.ref("orders").on("child_added", (snapshot) => {
        const order = snapshot.val();
        if (!order) return;

        let orderTs = Number(order.timestamp || snapshot.key.replace(/[^0-9]/g, '')) || Date.now();

        if (orderTs > lastCheckedTime) {
          document.getElementById('sirenCard').style.display = 'block';
          document.getElementById('sirenDetails').textContent = 
            `Order #${snapshot.key.slice(-6)} | ₹${order.total || '0'} | ${order.name || 'Customer'}`;
          
          db.ref("settings/sirenActive").set(true);
          triggerLoudSiren();
        }

        renderOrderCard(snapshot.key, order);
      });
    }

    function renderOrderCard(orderId, order) {
      const container = document.getElementById('ordersList');
      if (container.innerHTML.includes("Waiting for orders...")) {
        container.innerHTML = "";
      }
      const card = document.createElement('div');
      card.className = 'order-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px; color:#4a148c;">
          <span>#${orderId.slice(-6)}</span>
          <span style="color:#2e7d32;">₹${order.total || '0'}</span>
        </div>
        <div style="font-size:11.5px; color:#555; margin-top:3px;">👤 ${order.name || 'Customer'} (${order.phone || ''})</div>
        <div style="font-size:11px; color:#777;">📍 ${order.addr || 'Address not given'}</div>
      `;
      container.prepend(card);
    }
  </script>
</body>
</html>
