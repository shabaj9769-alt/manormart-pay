<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manor Mart Admin</title>
<style>
:root{--bg:#f4f7f3;--card:#fff;--tx:#1b2a1b;--mut:#667;--pri:#2e7d32;--bd:#d5e3d3;--red:#d32f2f;--org:#e65100}
@media (prefers-color-scheme:dark){:root{--bg:#121712;--card:#1c241c;--tx:#e8f0e8;--mut:#9aa89a;--pri:#43a047;--bd:#2c3a2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
input,button,select{font:inherit}input{color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
button{border:0;border-radius:8px;padding:8px 11px;color:#fff;background:var(--pri);font-weight:600;cursor:pointer}
button.o{background:var(--org)}button.r{background:var(--red)}button.g{background:#78909c}button.sm{padding:5px 8px;font-size:12px}
header{background:var(--pri);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:16px}#app{padding:10px 12px 40px;max-width:760px;margin:0 auto}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.login{max-width:320px;margin:15vh auto;text-align:center}.login input{width:100%;margin:10px 0}
.cat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.cat b{flex:1;min-width:140px}
.it{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.it.sold{background:rgba(211,47,47,.08)}.nm{flex:1;min-width:130px;overflow-wrap:anywhere}
.it input{width:68px}.it input.u{width:72px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.row input{flex:1;min-width:110px}
.mut{color:var(--mut);font-size:12px}h3{margin:4px 0 8px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;display:none;z-index:9;max-width:90vw}
</style></head><body>
