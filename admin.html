  TOKEN=x.d.idToken;REFRESH=x.d.refreshToken||'';clearInterval(timer);timer=setInterval(refresh,45*60*1000);$('lock').style.display='';load()})
 .catch(function(){$('msg').textContent='Server se connect nahi hua (internet ya CORS check karo).';$('go').disabled=false})}
function refresh(){fetch(API+'/admin-refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:J({refreshToken:REFRESH})}).then(function(r){return r.json()}).then(function(d){if(d.idToken){TOKEN=d.idToken;if(d.refreshToken)REFRESH=d.refreshToken}}).catch(function(){})}
function lock(m){TOKEN='';REFRESH='';clearInterval(timer);loginView(m)}
$('lock').onclick=function(){lock('')};
function load(){fb('categories.json').then(function(r){return r.json()}).then(function(d){if(d&&!d.error){CATS=d}else if(d===null){CATS={}}render()}).catch(function(){toast('Load fail hua')})}
function items(c){var o=CATS[c]||{};return Object.keys(o).filter(function(k){return k!=='image'&&k!=='discountPercent'&&o[k]&&typeof o[k]==='object'})}
function render(){var names=Object.keys(CATS),h='';
 h+='<div class="box"><input id="sq" placeholder="🔍 Product khojo (sab categories me)" value="'+esc(SEARCH)+'" style="width:100%"></div>';
 h+='<div class="box"><button class="o" id="bulk" style="width:100%">📦 Bulk Import Kirana List ('+KIRANA.reduce(function(a,c){return a+c.i.length},0)+' items)</button><p class="mut">Items price 0 aur Sold status me aate hain. Price daalo, phir Stock karo.</p></div>';
 h+='<div class="box"><h3>🖼️ Auto Photos (Pixabay)</h3><div class="row"><input id="pk" placeholder="Pixabay key (khali = Wikimedia)" value="'+esc(PK)+'"><button class="o" id="ph">Photos lagao</button></div><div class="row"><button class="o" id="rst">Purani hatao + sab naye lagao</button><button class="r sm" id="zs">Price 0 wale Sold karo</button></div><p class="mut" id="pst">'+esc(PST||'Key khali chhodo to Wikimedia se photo aayegi. Sirf bina photo wale items me lagegi.')+'</p></div>';
 h+='<div class="box"><h3>📁 Nayi Category</h3><div class="row"><input id="nc" placeholder="Category naam"><input id="nci" placeholder="Image URL (optional)"><button id="addc">Add</button></div></div>';
 h+='<div class="box"><h3>🛍️ Naya Product</h3><div class="row"><select id="pc" style="padding:8px;border-radius:8px">'+names.map(function(c){return'<option>'+esc(c)+'</option>'}).join('')+'</select><input id="pn" placeholder="Naam"><input id="pp" type="number" placeholder="Price ₹"><input id="pu" placeholder="Unit (1 kg)" value="1 kg"><button id="addp">Add</button></div></div>';
 var q=SEARCH.toLowerCase();
 names.forEach(function(c){var ks=items(c);if(q)ks=ks.filter(function(k){return(CATS[c][k].name||'').toLowerCase().indexOf(q)>-1});if(q&&!ks.length)return;
  var open=q||OPEN===c;
  h+='<div class="box"><div class="cat"><b data-o="'+esc(c)+'" style="cursor:pointer">'+(open?'▼':'▶')+' '+esc(c)+' <span class="mut">('+items(c).length+', '+(CATS[c].discountPercent||0)+'% OFF)</span></b>'+
  (open&&!q?'<input id="d_'+esc(c)+'" type="number" placeholder="%" style="width:60px"><button class="sm" data-dp="'+esc(c)+'">% Lagao</button><button class="sm o" data-st="'+esc(c)+'">Price wale → Stock</button><button class="sm r" data-dc="'+esc(c)+'">🗑</button>':'')+'</div>';
  if(open)ks.forEach(function(k){var p=CATS[c][k],sold=p.status==='sold';
   h+='<div class="it'+(sold?' sold':'')+'"><span class="nm">'+esc(p.name)+'</span><input type="number" data-c="'+esc(c)+'" data-k="'+k+'" data-f="price" value="'+(p.price||'')+'" placeholder="₹"><input type="number" data-c="'+esc(c)+'" data-k="'+k+'" data-f="discount" value="'+(p.discount||'')+'" placeholder="Disc"><input class="u" data-c="'+esc(c)+'" data-k="'+k+'" data-f="unit" value="'+esc(p.unit||'')+'"><button class="sm '+(sold?'g':'')+'" data-t="'+esc(c)+'|'+k+'">'+(sold?'Sold':'Stock')+'</button><button class="sm r" data-dx="'+esc(c)+'|'+k+'">✕</button></div>'});
  h+='</div>'});
 $('app').innerHTML=h;var sq=$('sq');sq.oninput=function(){SEARCH=this.value.trim();var pos=this.selectionStart;render();var n=$('sq');n.focus();n.setSelectionRange(pos,pos)};
 $('bulk').onclick=bulk;$('ph').onclick=photos;$('rst').onclick=redoAll;$('zs').onclick=zeroSold;$('addc').onclick=addCat;$('addp').onclick=addProd}
function bulk(){if(!confirm('Ready list ke saare items add honge (price 0, Sold). Maujood naam skip honge. Continue?'))return;var patch={},n=0;
 KIRANA.forEach(function(c){var cn=san(c.n),ex=CATS[cn]||{},have={};Object.keys(ex).forEach(function(k){if(ex[k]&&ex[k].name)have[ex[k].name.toLowerCase()]=1});
  if(!CATS[cn])patch[cn+'/image']='';
  c.i.forEach(function(it){if(have[it[1].toLowerCase()])return;patch[cn+'/'+it[0]]={id:it[0],name:it[1],price:0,discount:0,unit:c.u,image:'',status:'sold',inStock:false};n++})});
 if(!n)return toast('Sab pehle se maujood hai');
 fb('categories.json',{method:'PATCH',body:J(patch)}).then(function(r){if(!r.ok)throw 0;toast(n+' products import ho gaye');load()}).catch(function(){toast('Import fail hua')})}
function addCat(){var c=san($('nc').value);if(!c)return toast('Category naam daalo');
 fb('categories/'+encodeURIComponent(c)+'/image.json',{method:'PUT',body:J($('nci').value.trim())}).then(function(){toast('Category ban gayi');load()})}
function addProd(){var c=$('pc').value,n=$('pn').value.replace(/\s+/g,' ').trim(),p=Number($('pp').value);if(!c||!n||!p)return toast('Category, naam aur price daalo');
 var id='prod_'+Date.now(),pct=Number((CATS[c]||{}).discountPercent||0);
 fb('categories/'+encodeURIComponent(c)+'/'+id+'.json',{method:'PUT',body:J({id:id,name:n,price:p,discount:Math.round(p*pct/100),unit:$('pu').value||'1 kg',image:'',status:'available',inStock:true})}).then(function(){toast('Product add hua');load()})}
$('app').addEventListener('change',function(e){var t=e.target,c=t.getAttribute('data-c');if(!c)return;var k=t.getAttribute('data-k'),f=t.getAttribute('data-f'),v=f==='unit'?t.value:Number(t.value||0),b={};b[f]=v;
 fb('categories/'+encodeURIComponent(c)+'/'+k+'.json',{method:'PATCH',body:J(b)}).then(function(r){if(!r.ok)throw 0;CATS[c][k][f]=v;toast('Save ho gaya')}).catch(function(){toast('Save fail')})});
$('app').addEventListener('click',function(e){var t=e.target,a;
 if((a=t.getAttribute('data-o'))){OPEN=OPEN===a?null:a;render()}
 else if((a=t.getAttribute('data-t'))){var s=a.split('|'),p=CATS[s[0]][s[1]],ns=p.status==='sold'?'available':'sold',b={status:ns,inStock:ns==='available'};
  fb('categories/'+encodeURIComponent(s[0])+'/'+s[1]+'.json',{method:'PATCH',body:J(b)}).then(function(){p.status=b.status;p.inStock=b.inStock;render()})}
 else if((a=t.getAttribute('data-dx'))){var s2=a.split('|');if(!confirm('"'+CATS[s2[0]][s2[1]].name+'" delete kare?'))return;
  fb('categories/'+encodeURIComponent(s2[0])+'/'+s2[1]+'.json',{method:'DELETE'}).then(function(){delete CATS[s2[0]][s2[1]];render();toast('Delete ho gaya')})}
 else if((a=t.getAttribute('data-dc'))){if(!confirm('Poori category "'+a+'" delete kare?'))return;
  fb('categories/'+encodeURIComponent(a)+'.json',{method:'DELETE'}).then(function(){delete CATS[a];OPEN=null;render();toast('Category delete hui')})}
 else if((a=t.getAttribute('data-st'))){var b2={},n=0;items(a).forEach(function(k){var p=CATS[a][k];if(p.status==='sold'&&Number(p.price)>0){b2[k+'/status']='available';b2[k+'/inStock']=true;n++}});
  if(!n)return toast('Koi priced Sold item nahi mila');fb('categories/'+encodeURIComponent(a)+'.json',{method:'PATCH',body:J(b2)}).then(function(){toast(n+' items Stock me aa gaye');load()})}
 else if((a=t.getAttribute('data-dp'))){var d=Number(($('d_'+a)||{}).value||0);if(isNaN(d)||d<0||d>100)return toast('0-100 ke beech % daalo');var b3={discountPercent:d};
  items(a).forEach(function(k){b3[k+'/discount']=Math.round(Number(CATS[a][k].price||0)*d/100)});
  fb('categories/'+encodeURIComponent(a)+'.json',{method:'PATCH',body:J(b3)}).then(function(){toast(d+'% discount lag gaya');load()})}});
var HI={pyaaz:'onion',aloo:'potato',tamatar:'tomato',lehsun:'garlic',adrak:'ginger',mirch:'chili pepper',nimbu:'lemon',dhania:'coriander',pudina:'mint',palak:'spinach',methi:'fenugreek',gobhi:'cauliflower',bhindi:'okra',baingan:'eggplant',lauki:'bottle gourd',karela:'bitter gourd',gajar:'carrot',mooli:'radish',kheera:'cucumber',matar:'green peas',kaddu:'pumpkin',seb:'apple',santra:'orange',mosambi:'sweet lime',angoor:'grapes',anar:'pomegranate',papita:'papaya',tarbooz:'watermelon',aam:'mango',kele:'banana',nariyal:'coconut',chawal:'rice',atta:'wheat flour',gehu:'wheat',besan:'gram flour',maida:'flour',suji:'semolina',poha:'flattened rice',dal:'lentils',toor:'pigeon peas',moong:'mung beans',masoor:'red lentils',chana:'chickpeas',urad:'black gram',rajma:'kidney beans',tel:'cooking oil',doodh:'milk',dahi:'yogurt',ande:'eggs',chini:'sugar',chai:'tea',patti:'tea leaves',gud:'jaggery',namak:'salt',haldi:'turmeric',jeera:'cumin',kaju:'cashew nuts',badam:'almonds',kishmish:'raisins',pista:'pistachio',akhrot:'walnut',khajoor:'dates fruit',anjeer:'fig',sabun:'soap',agarbatti:'incense sticks',diya:'oil lamp',jhadu:'broom',pocha:'mop',surf:'detergent',saunf:'fennel seeds',elaichi:'cardamom',laung:'cloves',dalchini:'cinnamon',sabut:'whole',sarson:'mustard oil',moongfali:'peanuts',murmura:'puffed rice',sabudana:'sago',sevai:'vermicelli',papad:'papad',achar:'pickle',batti:'wick',kapoor:'camphor',paani:'water bottle',rassi:'rope',kapde:'clothes',mewa:'dry fruits',ladi:'bread',pav:'bread bun',khari:'puff pastry'};
var FB=['wheat flour grains','lentils pulses','cooking oil','indian spices','tea sugar','biscuits','indian snacks namkeen','chocolate candy','milk dairy bread','fresh vegetables','dry fruits nuts','soft drink bottle','cleaning supplies','personal care soap shampoo','packaged food noodles','incense puja items'];
function fbq(c){var i=KIRANA.findIndex(function(x){return san(x.n)===c});return i>-1?FB[i]:c}
function qry(n){var w=n.toLowerCase().split(/[^a-z]+/).filter(function(x){return x.length>1&&['pkt','kg','ml','and','aur','ka','ki','ke'].indexOf(x)<0}),hit=false,o=w.map(function(x){if(HI[x]){hit=true;return HI[x]}return x});return hit?o.join(' '):o.join(' ')}
function pex(key,q){return fetch('https://pixabay.com/api/?image_type=photo&safesearch=true&per_page=3&key='+encodeURIComponent(key)+'&q='+encodeURIComponent(q.slice(0,90))).then(function(r){if(r.status===429)throw{limit:1};if(!r.ok)throw{};return r.json()}).then(function(d){return d.hits&&d.hits[0]?d.hits[0].webformatURL:''})}
function wiki(q){return fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url|mime&iiurlwidth=400&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')).then(function(r){if(r.status===429)throw{limit:1};if(!r.ok)throw{};return r.json()}).then(function(d){var p=d.query&&d.query.pages?Object.keys(d.query.pages).map(function(k){return d.query.pages[k]}).sort(function(a,b){return a.index-b.index}):[];for(var n=0;n<p.length;n++){var ii=p[n].imageinfo&&p[n].imageinfo[0];if(ii&&ii.thumburl&&/jpeg|png/.test(ii.mime))return ii.thumburl}return ''})}
function setst(m){PST=m;var e=$('pst');if(e)e.textContent=m}
function photos(){var key=$('pk').value.trim();try{localStorage.setItem('pexkey',key)}catch(e){}PK=key;var src=key?function(q){return pex(key,q)}:wiki;
 var todo=[];Object.keys(CATS).forEach(function(c){items(c).forEach(function(k){if(!CATS[c][k].image)todo.push([c,k])})});
 if(!todo.length)return toast('Sab items me photo hai');
 var i=0,patch={},got=0;
 function flush(){if(!Object.keys(patch).length)return Promise.resolve();var b=patch;patch={};return fb('categories.json',{method:'PATCH',body:J(b)})}
 function step(){if(i>=todo.length)return flush().then(function(){setst('Ho gaya: '+got+' photos lagi');load()});
  var t=todo[i],p=CATS[t[0]][t[1]];setst((i+1)+'/'+todo.length+' - '+p.name);
  var cx=ctx(t[0]),qq=qry(p.name);return src(cx?qq+' '+cx:qq).then(function(u){return u||src(fbq(t[0]))}).then(function(u){if(u){patch[t[0]+'/'+t[1]+'/image']=u;p.image=u;got++}i++;
   return (Object.keys(patch).length>=20?flush():Promise.resolve())}).then(function(){return new Promise(function(r){setTimeout(r,700)})}).then(step)}
 step().catch(function(e){return flush().then(function(){setst(e&&e.limit?'Limit poori ('+got+' photos lagi). 1 minute ruk kar dobara dabao, baaki wahin se chalu hoga.':'Error: internet ya key check karo ('+got+' photos lagi)');render()})})}

function ctx(c){var i=KIRANA.findIndex(function(x){return san(x.n)===c});return{5:'biscuit',6:'snack',7:'chocolate',11:'drink',12:'detergent',13:'soap',14:'food'}[i]||''}
function resetPhotos(){if(!confirm('Sab items ki photo hatani hai? (Phir Photos lagao dabane par naye search se lagengi)'))return;var b={},n=0;
 Object.keys(CATS).forEach(function(c){items(c).forEach(function(k){if(CATS[c][k].image){b[c+'/'+k+'/image']='';n++}})});
 if(!n)return toast('Koi photo nahi hai');fb('categories.json',{method:'PATCH',body:J(b)}).then(function(){toast(n+' photos hata di');load()})}
function zeroSold(){var b={},n=0;Object.keys(CATS).forEach(function(c){items(c).forEach(function(k){var p=CATS[c][k];if(!(Number(p.price)>0)&&(p.status!=='sold'||p.inStock!==false)){b[c+'/'+k+'/status']='sold';b[c+'/'+k+'/inStock']=false;n++}})});
 if(!n)return toast('Price 0 wala har item pehle se Sold hai');fb('categories.json',{method:'PATCH',body:J(b)}).then(function(){toast(n+' items Sold kiye');load()})}

function redoAll(){if(!confirm('Sab purani photo hat jayengi aur sab items ki photo naye se lagengi (5-10 minute). Page khula rakhna. Continue?'))return;var b={};
 Object.keys(CATS).forEach(function(c){items(c).forEach(function(k){if(CATS[c][k].image){b[c+'/'+k+'/image']='';CATS[c][k].image=''}})});
 if(!Object.keys(b).length)return photos();
 fb('categories.json',{method:'PATCH',body:J(b)}).then(function(r){if(!r.ok)throw 0;photos()}).catch(function(){toast('Purani photo hatane me dikkat aayi')})}

loginView();
</script></body></html>
